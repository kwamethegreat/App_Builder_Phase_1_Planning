summary: >-
  Exact seed provenance, material BOM dispositions, resource pools and failure-domain
  identifiers are present. The baseline is not ready for downstream implementation:
  sizing and source authority are unsubstantiated, portability is restricted contrary
  to the seed, and compatibility, shutdown, storage acceptance, recovery and consumed
  contracts have material gaps.
findings:
  - id: REVIEWER-EN-SE11-PHYSICAL-01
    type: source_gap
    severity: major
    location: '§1.1; §15 sign-off; §16.3 Conflicts'
    description: >-
      Missing Stage-0 coverage is marked not applicable, and §16.3 incorrectly says
      no upstream dependency is listed despite the task's extensive required
      dependencies. The document acknowledges that proposed Rev 1.1 lacks established
      approval authority, then signs off an authoritative downstream baseline.
      Mapping future register rows without changing dispositions prevents genuine
      reconciliation. Missing sources do not establish compliance or approval.
    required_change: >-
      Correct the dependency inventory and distinguish unavailable from inapplicable.
      Record the source-authority decision and required consistency checks as evidence
      gates. Until evidenced, identify the design as conditional and prohibit downstream
      implementation freeze. Reconciliation must permit changes to dispositions rather
      than merely attach new ids to existing conclusions.
  - id: REVIEWER-EN-SE11-PHYSICAL-02
    type: unsupported_addition
    severity: major
    location: '§4.1 SE11-DEC-04; §4.3; §5.1 SE11-DEC-14; §13.2 SE11-ADR-02'
    description: >-
      The maximum 256 GB host configuration is adopted from assumed pool ranges
      without job counts, concurrency, measured working sets or a derivation from
      workload requirements. The 140–280 GB total excludes the additional 15 percent
      reserve, and the upper case exceeds installed memory. ADR-02 explicitly refuses
      reversal if measured sizing shows under-use. Six 20 TB NAS drives are justified
      as a minimum useful set without a retention/capacity model. This does not meet
      ENV-DEC-017 or SEED-01 §160/§238 evidence-based provisioning requirements.
    required_change: >-
      Derive the minimum safe configuration from workload, retention and concurrency
      evidence, including headroom and feasible reservations/admission limits. Compare
      smaller and equivalent delivery configurations. Keep unevidenced sizes candidate
      rather than adopted, and allow measurements to reverse the decision.
  - id: REVIEWER-EN-SE11-PHYSICAL-03
    type: dependency_inconsistency
    severity: major
    location: '§9.4; §13.2 SE11-ADR-01/08'
    description: >-
      ADR-01 rejects all-hosted delivery as forbidden by the seed and requires a seed
      change to reconsider it. ADR-08 treats the consumer AM5 reference configuration
      as fixed. Verified SEED-01 §160 explicitly permits different greenfield hardware,
      hosted capacity and hybrid delivery; §238 explicitly permits managed equivalents
      for central compute, NAS, power and worker infrastructure.
    required_change: >-
      Correct the ADR premises. Evaluate delivery classes against the same isolation,
      performance, resilience, portability and governance outcomes. Justify local
      selection with workload/economics evidence, not an invented source prohibition,
      and preserve permitted placement changes without requiring a seed amendment.
  - id: REVIEWER-EN-SE11-PHYSICAL-04
    type: outline_gap
    severity: major
    location: '§3.1; §4.1/4.2; §10; §14 AC-01/02/09; §15 QC-AR-03'
    description: >-
      QC-AR-03 is marked covered although current manufacturer support, availability
      and populated-system compatibility checks remain future work. Nominal connector
      matching is not current support evidence. The matrix says virtualization
      coexistence is validated without test evidence. GPU pass-through into a Linux VM
      is committed without a supported assignment mechanism for the Windows 11 Pro,
      Hyper-V, board, firmware and driver combination. Activation checks only clearance
      and power. Dedicated M2_4 access is ambiguous between device/disk pass-through
      and host-managed virtual disks, with different encryption and recovery behavior.
    required_change: >-
      Separate nominal fit, inferred compatibility and verified support; retain
      unevidenced combinations as candidates behind a pre-freeze gate. Supply dated
      support evidence and define/test supported storage and accelerator presentation,
      host/guest versions, isolation, reset and recovery. Make these tests mandatory
      before activation. Remove completed-validation claims not backed by evidence.
  - id: REVIEWER-EN-SE11-PHYSICAL-05
    type: downstream_unusable
    severity: major
    location: '§4.1 SE11-DEC-05/10a; §5.2; §14 AC-02/06; §16.4 NFR-01'
    description: >-
      AC-06/NFR-01 require every drive to reach at least 70 percent of rated sequential
      speed, but §5.2 expects M2_3 to deliver at most approximately 50 percent of the
      drive rating because its slot is x2. No numerical slot-adjusted rating resolves
      the conflict. The SATA scratch fallback must preserve every NFR, while AC-02
      still requires M2_3 enumeration and AC-06 still applies the NVMe criterion.
      Neither branch has a consistent acceptance path.
    required_change: >-
      Define role- and slot-specific numeric read/write thresholds, test conditions
      and workload adequacy criteria. Select enumeration and performance predicates
      according to the realized disposition, including x2 and SATA branches. Record
      substitution throughput/topology/test impacts and demonstrate preserved outcomes;
      otherwise prohibit the fallback under the unchanged-NFR substitution rule.
  - id: REVIEWER-EN-SE11-PHYSICAL-06
    type: downstream_unusable
    severity: major
    location: '§7.1/7.4; §9.4; §14 AC-08'
    description: >-
      Shutdown names USB-HID and a NAS network-UPS function but no supported host-side
      coordinator, interoperable protocol, acknowledgement or independent NAS trigger.
      The host signals shutdown complete before powering off. Low runtime has no
      threshold or budget; a hung VM/host, failed USB link or lost network message has
      no bounded fallback. Twice the normal sequence duration does not establish safe
      shutdown when the coordinator or communication path fails.
    required_change: >-
      Specify or cite an owned supported coordination contract with server/client roles,
      protected communication path, runtime trigger budget, bounded deadlines,
      acknowledgements and timeout behavior. Distinguish final-write completion from
      host power-off and provide independent NAS fallback. Extend AC-08 to test host,
      USB and network loss, hung participants, low battery and restored mains.
  - id: REVIEWER-EN-SE11-PHYSICAL-07
    type: scope
    severity: major
    location: '§11; §15 Contract registration; §16.1/16.4'
    description: >-
      Consumed recovery, retention, network, security, telemetry and operations
      interfaces are roles or generic future documents, not owner/versioned contract
      ids. Security rows explicitly lack control ids and RPO/RTO remain future inputs.
      The provided contract is declared registered here while registration in the
      interface and EL registers is future work. A local declaration does not establish
      governed registration or make unavailable consumed contracts buildable.
    required_change: >-
      Cite consumed contracts by id, version and owner, map NFR/security obligations to
      governing ids, and cite registration evidence for the provided contract. Do not
      invent another domain's contract or controls. Treat absent inputs as explicitly
      identified unfulfilled dependencies with non-consumption gates, not implemented
      interfaces or completed traceability.
  - id: REVIEWER-EN-SE11-PHYSICAL-08
    type: downstream_unusable
    severity: major
    location: '§5.1; §8 FD-NAS/FD-CIRCUIT-A; §14 acceptance; §16.2 ASM-SE11-04'
    description: >-
      ASM-SE11-04 requires an isolated/off-site copy before the first accepted stage
      baseline, but no acceptance check establishes its existence, independence or
      restorability. AC-10 and AC-12 restore from NAS; restoring to a non-NAS host does
      not establish survival of simultaneous host/NAS/site loss. The baseline can pass
      while every copy remains in the shared power/site failure domain.
    required_change: >-
      Bind the independent-copy dependency to an owner/versioned storage contract and
      make establishment and restore evidence mandatory at the ASM-SE11-04 acceptance
      boundary. Define protected classes, cadence, data-loss/recovery bounds and key/
      configuration recovery. Test with both host and NAS unavailable. If protection
      is deferred, constrain permitted data/use instead of declaring the stage accepted.
  - id: REVIEWER-EN-SE11-PHYSICAL-09
    type: downstream_unusable
    severity: major
    location: '§2.3; §6.1/6.2; §12.3; §16.2 ASM-SE11-01'
    description: >-
      The greenfield topology presumes a gateway with at least 1 GbE ports, diagrams
      5 GbE paths, specifies only 2.5 GbE if the assumption fails, and tests a 5 GbE
      path. Port count, protected power and provisioning owner are not fixed.
      Management shares the north-south segment without an enforcement contract.
      Direct host-link saturation triggers adding a switch despite retaining the same
      single 10GbE host path; §6.2 instead calls for architecture revision. NAS-side
      aggregation also has no demonstrated effect on that host bottleneck.
    required_change: >-
      Define an owned greenfield gateway prerequisite with consistent realized speed,
      port count, power relationship, readiness gate and management-isolation contract.
      Include negative reachability tests. Separate endpoint fan-out from throughput
      remediation, and route saturation to an action that changes limiting host-path
      capacity or workload demand, with measurable post-action success criteria.
  - id: REVIEWER-EN-SE11-PHYSICAL-10
    type: downstream_unusable
    severity: major
    location: '§7.1/7.2/7.3; §12.1; §14 AC-05/08'
    description: >-
      Listed no-GPU component estimates sum to 240–350 W, not 340–380 W; adding 145 W
      yields 385–495 W, not 480–530 W. No loss/contingency basis reconciles the totals.
      PSU DC output and wall AC load are conflated, gateway load and NAS spin-up are
      omitted, and PD-B uses its UPS rating rather than a load envelope. The GPU-case
      PD-A estimate reaches 680 W, above the 600 W steady ceiling, while AC-05 enforces
      only the 750 W peak ceiling. Claimed spare headroom has no consistent acceptance
      calculation.
    required_change: >-
      Recalculate auditable DC/AC component and domain totals with explicit losses,
      contingency, all protected loads and transients. Bound PD-B demand before
      activation. Validate steady and peak ceilings and shutdown runtime for the same
      worst-permitted configuration. Define GPU activation rejection or power-domain
      revision on any failed envelope, and derive spare headroom from this budget.
  - id: REVIEWER-EN-SE11-PHYSICAL-11
    type: downstream_unusable
    severity: major
    location: '§8 failure domains; §13.1 risk owners; §16.1'
    description: >-
      Common-mode UPS/circuit/building-supply, rack/PDU and gateway failures are named
      but lack explicit accountable mitigation/recovery owners. The risk table does
      not allocate these domains; the electrician only verifies circuits. Generic
      SE20 runbook ownership does not assign recovery accountability across hardware,
      network and facility boundaries. ENV-DEC-017 requires common-mode failures to
      be owned, not merely listed.
    required_change: >-
      Add a failure-domain-to-accountable-owner mapping with supporting owners and
      owned mitigation/recovery interfaces, including shared facility and communication
      dependencies. Link each assignment to the relevant acceptance/fault-injection
      evidence and operational handoff.
