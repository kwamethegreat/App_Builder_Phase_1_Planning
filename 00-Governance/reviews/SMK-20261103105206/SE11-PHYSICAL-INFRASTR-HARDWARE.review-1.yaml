summary: >-
  The exact BOM version and material engineering dispositions are present, but the
  signed baseline is not buildable. Capacity adoption lacks evidence, portability
  is restricted contrary to the seed, compatibility is not established, and storage
  acceptance contradicts the selected topology. Shutdown, recovery, network
  prerequisites and cross-domain contracts remain incomplete.
findings:
  - id: REVIEWER-EN-SE11-PHYSICAL-01
    type: source_gap
    severity: major
    location: '§1.1; §15; §16.3'
    description: >-
      The mandatory Stage-0 register is made not applicable because it is missing.
      Section 16.3 incorrectly says no upstream dependency is listed despite the
      task's required PM09, NT16, EL and SP16 dependencies. The document acknowledges
      unresolved authority for proposed Rev 1.1, then signs off the baseline. Mapping
      future register rows without changing dispositions prevents real reconciliation.
    required_change: >-
      Correct the dependency inventory and distinguish unavailable from inapplicable.
      Record the source-authority decision and reconcile dispositions against the
      required register and architecture references. Until evidence exists, identify
      the reference design as conditional and prohibit downstream implementation
      freeze; do not assert approval or upstream consistency.
  - id: REVIEWER-EN-SE11-PHYSICAL-02
    type: unsupported_addition
    severity: major
    location: '§4.1 SE11-DEC-04; §4.3; §5.1 SE11-DEC-14; §13.2 SE11-ADR-02'
    description: >-
      The board-maximum 256 GB is adopted from assumed per-pool ranges without
      workload counts, working sets or concurrency evidence. The stated 140–280 GB
      total excludes the 15 percent reserve and its upper case exceeds installed
      capacity. ADR-02 refuses reversal even if measurements show under-use. Six
      20 TB NAS drives are justified as the minimum with useful capacity without a
      retention/capacity calculation. This fails ENV-DEC-017 and SEED-01 §160/§238's
      evidence-based provisioning requirement.
    required_change: >-
      Derive a minimum safe configuration from a traceable workload, concurrency and
      retention model, including reserves and admission/burst limits. Compare feasible
      smaller/local/hosted options. Keep unevidenced sizes candidate rather than
      adopted and allow measured sizing to reverse adoption.
  - id: REVIEWER-EN-SE11-PHYSICAL-03
    type: dependency_inconsistency
    severity: major
    location: '§9.4; §13.2 SE11-ADR-01/08'
    description: >-
      ADR-01 rejects all-hosted capacity as prohibited by the seed and requires a
      seed amendment to reconsider it. ADR-08 describes the consumer AM5 reference
      configuration as fixed. Verified SEED-01 §160 permits different greenfield
      hardware, hosted capacity or hybrid delivery; §238 expressly permits managed
      equivalents for central compute, NAS, power and worker infrastructure.
    required_change: >-
      Correct the ADR premises and evaluate alternatives against the same isolation,
      performance, resilience, portability and governance outcomes. Justify any local
      selection with platform evidence, not an invented source prohibition. Preserve
      permitted placement changes without requiring a seed amendment.
  - id: REVIEWER-EN-SE11-PHYSICAL-04
    type: outline_gap
    severity: major
    location: '§4.2; §10.1/10.2; §14 AC-01/02/09; §15 QC-AR-03'
    description: >-
      QC-AR-03 is marked covered although current manufacturer support, availability
      and populated-system compatibility checks are future work. Nominal connector
      and capacity matching is treated as compatibility evidence. The virtualization
      row says coexistence validated although AC-09 is unexecuted. GPU assignment to
      a Linux VM has no specified supported mechanism for the selected Windows 11
      Pro/Hyper-V/board/driver combination, and no guest-device acceptance test.
      Dedicated M2_4 access is ambiguous between disk pass-through, device assignment
      and host-managed virtual disk, with different encryption/recovery implications.
    required_change: >-
      Separate nominal fit, inferred compatibility and verified support. Supply dated
      evidence or retain unverified combinations as candidates behind a pre-freeze
      gate. Specify and validate disk/GPU presentation, supported host/guest/firmware/
      driver versions, isolation, reboot and recovery behavior. Remove unsupported
      completed-validation claims.
  - id: REVIEWER-EN-SE11-PHYSICAL-05
    type: downstream_unusable
    severity: major
    location: '§4.1 SE11-DEC-05/10a; §5.2; §14 AC-02/06; §16.4 NFR-01'
    description: >-
      AC-06/NFR-01 require every drive to achieve at least 70 percent of rated
      sequential speed, while §5.2 caps M2_3 at approximately 50 percent of that rating
      because its slot is x2. Documenting x2 does not change the pass criterion. The
      SATA scratch fallback must preserve every NFR, while AC-02 still requires M2_3
      enumeration and AC-06 still applies the NVMe criterion. Neither branch has a
      consistent acceptance path.
    required_change: >-
      Define numeric read/write thresholds and test conditions by realized slot and
      workload role, including explicit x2 and SATA branches. Select enumeration and
      performance predicates by disposition. Demonstrate preservation of scratch
      workload outcomes and record throughput/topology/test impacts of substitution.
  - id: REVIEWER-EN-SE11-PHYSICAL-06
    type: downstream_unusable
    severity: major
    location: '§7.1/7.4; §8 FD-UPS-A/FD-MGMT; §14 AC-08'
    description: >-
      Shutdown names USB-HID and a NAS network-UPS function but no compatible host-to-
      NAS protocol, coordinator, acknowledgement or timeout behavior. SEED-01 §228.1
      describes a NAS network UPS server, not the asserted Windows-host completion-
      signalling integration. The host signals shutdown complete before powering
      off. Low runtime has no trigger threshold; a hung host, failed USB/link or
      non-responsive VM has no bounded fallback. Twice the normal sequence duration
      does not establish safety under those failures.
    required_change: >-
      Specify or cite an owned supported coordination contract, power-backed control
      path, trigger budget, bounded stage deadlines, completion acknowledgements and
      independent NAS fallback. Distinguish final-write completion from host power-
      off. Extend AC-08 to cover host/network/USB loss, hung participants, low battery
      and restored mains with bounded expected results.
  - id: REVIEWER-EN-SE11-PHYSICAL-07
    type: scope
    severity: major
    location: '§11; §15 Contract registration; §16.1/16.4'
    description: >-
      Consumed storage, recovery, network, security and operations interfaces are
      referenced only by role or generic design title, not contract id/version and
      owner. RPO/RTO and security control ids remain future promises. The provided
      contract is declared registered here while registration in the interface
      document and EL register is future work. A local declaration does not establish
      governed registration or make absent recovery/security contracts usable.
    required_change: >-
      Identify each consumed contract by id, version and owner; map hardware NFRs and
      controls to governing ids without copying another domain's schema. Cite actual
      registration evidence for the provided contract. Treat unavailable inputs as
      unfulfilled dependencies with explicit consumption gates, not implemented
      interfaces or completed traceability.
  - id: REVIEWER-EN-SE11-PHYSICAL-08
    type: downstream_unusable
    severity: major
    location: '§5.1; §8 FD-NAS/FD-CIRCUIT-A; §14 acceptance gate; §16.2 ASM-SE11-04'
    description: >-
      ASM-SE11-04 promises an isolated/off-site copy before the first accepted stage
      baseline, but no acceptance check establishes its existence, independence or
      restorability. AC-10 restores from NAS and AC-12 restores a NAS backup to a
      non-NAS host; neither proves survival of simultaneous host/NAS/site loss. The
      baseline can pass while every copy remains in the shared power/site domain.
    required_change: >-
      Make isolated-copy establishment and restore verification mandatory acceptance
      prerequisites. Cite an owned contract for protected classes, independent
      placement, cadence, RPO/RTO and key/configuration recovery. Test with host and
      NAS unavailable. If protection is deferred, constrain permitted data/use and
      do not declare that stage baseline accepted.
  - id: REVIEWER-EN-SE11-PHYSICAL-09
    type: downstream_unusable
    severity: major
    location: '§2.3; §6.1/6.2; §12.3 TRG-SWITCH/TRG-10GBE-SATURATION; §16.2 ASM-SE11-01'
    description: >-
      The design presumes an existing gateway with at least 1 GbE ports, diagrams
      5 GbE connections, proposes only 2.5 GbE when the assumption fails, and requires
      verification of a 5 GbE path. Port count, segmentation and protected-power
      readiness are not established. Management shares the north-south segment
      without a defined enforcement contract. Direct host-link saturation triggers
      adding a switch although the same single host link remains the bottleneck.
    required_change: >-
      Define an owned greenfield gateway dependency with consistent realized speed,
      port count, management-isolation capability, power relationship and readiness
      gate. Cite the network/security contract. Route host-link saturation directly
      to a remedy or architecture review that changes path capacity or workload
      traffic; separate endpoint expansion from throughput remediation.
  - id: REVIEWER-EN-SE11-PHYSICAL-10
    type: downstream_unusable
    severity: major
    location: '§7.1/7.2/7.3; §14 AC-05/08'
    description: >-
      The no-GPU component estimates sum to 240–350 W, not the stated 340–380 W;
      adding 145 W yields 385–495 W, not 480–530 W. No loss or contingency allowance
      reconciles the totals. PSU DC output and wall AC draw are not separated.
      Gateway draw and NAS spin-up are omitted from the PD-A total. PD-B's budget
      is its UPS rating rather than a load envelope with headroom.
    required_change: >-
      Recalculate auditable component/domain totals, separating DC demand, losses,
      contingency and AC wall load. Include every protected load and transient
      allowance with distinct steady/peak limits. Establish a bounded PD-B load
      envelope before activation. Use the same configurations and measurement
      boundaries in power and runtime acceptance.
  - id: REVIEWER-EN-SE11-PHYSICAL-11
    type: downstream_unusable
    severity: major
    location: '§8 failure-domain table; §13.1 risk owners; §16.1'
    description: >-
      Failure domains are named but several common-mode domains have no explicit
      accountable recovery owner: UPS/circuit/building-supply loss, shared rack/PDU
      and site gateway loss. The risk table does not cover these domains, a qualified
      electrician is only assigned circuit verification, and SE20's generic runbook
      responsibility does not allocate mitigation or recovery accountability per
      domain. ENV-DEC-017 requires common-mode failures to be owned, not merely named.
    required_change: >-
      Add an explicit FD-to-accountable-owner mapping, supporting owners and owned
      mitigation/recovery contracts for every domain, including shared facility and
      communication dependencies. Link each owner to the relevant acceptance and
      fault-injection evidence.
