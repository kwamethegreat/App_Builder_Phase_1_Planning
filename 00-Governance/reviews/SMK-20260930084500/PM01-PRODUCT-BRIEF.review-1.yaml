      portfolio brand to SP22. These concerns are expressly consumed by sections
      2, 5 and 6. The seed-only fallback in ASM-PM01-04 omits these applicable
      interfaces, so consumers can route forecasts and readiness inputs without
      their specialist authorities.
    required_correction: >-
      Read the available STD-NE-01 routing overlay and relevant expansion entries.
      Update sections 4, 6 and the forecast acceptance/evidence handoff to identify
      SP18's suggested-concept handoff and SP20's forecast-methodology/calibration
      inputs, separating PM01's presentation/continuity outcome from specialist
      ownership and Project's committed schedule. Add proportionate SP19, SP21 and
      SP22 input/revalidation interfaces for the audience, qualification and
      commercial-resilience/portfolio-brand concerns actually consumed here, or
      explicit justified non-applicability where a concern is not used. Reference
      standard artifact titles/sections when output files are unavailable; do not
      invent approved artifacts. Replace the obsolete standard-access fallback
      and record STD-NE-01 in based_on when relied upon.
