  - id: REVIEWER-EN-SE11-PHYSICAL-003
    severity: major
    type: dependency_inconsistency
    outline_id: QC-SE11-PHYSICAL-INFRASTRUCTURE-HARDWARE-AR-06
    source_or_requirement_id: SE11-CONTRACT-hardware-baseline@1
    description: >-
      The prior contract-discipline finding is not closed by renaming missing
