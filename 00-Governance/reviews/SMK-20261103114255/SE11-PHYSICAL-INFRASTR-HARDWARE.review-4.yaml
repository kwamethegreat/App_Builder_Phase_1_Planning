  - id: REVIEWER-EN-SE11-PHYSICAL-003
    severity: major
    type: dependency_inconsistency
    outline_id: QC-SE11-PHYSICAL-INFRASTRUCTURE-HARDWARE-AR-06
    source_or_requirement_id: SE11-DEP-11
    description: >-
      Retained. Section 18.2 still provides two normative interfaces with
