  - id: REVIEWER-EN-SE11-PHYSICAL-003
    severity: major
    type: downstream_unusable
    outline_id: OUT-SE11-PHYSICAL-INFRASTRUCTURE-HARDWARE-AR-05
    source_or_requirement_id: SE11-REQ-24
    description: >-
      Section 6.3b enforces expiry solely by store wall-clock comparisons. L2
      checks skew only when a lease arrives, and L5 detects only a backward jump
      beyond U relative to a wall-clock high-water mark. With the publisher down,
      a store clock that stops, or progresses sufficiently slowly, can remain
      below until-U without ever moving below hw_time-U. L3 then permits mutations
      indefinitely despite expiry in elapsed time. A common time-source statement
      does not specify a time-health check or a fail-safe when that source is
      unavailable. Consequently the assertion that L2/L5 bound store time to the
      publisher within U throughout an arbitrarily long outage, and the resulting
      SE11-NFR-05 exposure guarantee, do not follow from these rules. AC-07e tests
      large clock jumps but does not exercise this counterexample.
    required_correction: >-
      Specify an enforceable elapsed-time deadline in addition to the absolute
      timestamp, using a monotonic time source with stated progress and suspend
      semantics, bounded uncertainty and fail-closed behavior when time health
      cannot be established. Define restart behavior when the elapsed-time anchor
      cannot be trusted; a persisted lease alone must not renew its remaining
      lifetime. Alternatively narrow the guarantee explicitly and establish the
      required clock-health precondition with an enforcing watchdog. Extend
      AC-07e to publisher outage with a stopped or slow wall clock, loss of time
      synchronization, suspend/resume and restart, demonstrating that writes cannot
      outlive the declared exposure bound.
  - id: REVIEWER-EN-SE11-PHYSICAL-011
    severity: major
    type: downstream_unusable
    outline_id: OUT-SE11-PHYSICAL-INFRASTRUCTURE-HARDWARE-AR-05
    source_or_requirement_id: SE11-REQ-17
    description: >-
      The authoritative table in section 6.3a is still not a complete implementable
      event/state contract. P1c deduplicates by producer_id, copy_id and event,
      whereas Part C supplies copy_id only for COPY/RESTORE records. Repeated
      MECH_FIXTURE_OK records, CUSTODY events and DATASET_CREATED records therefore
      have no defined distinct identities: treating the missing copy_id as null
      suppresses later legitimate stage-gate evidence and can suppress later
      DATASET_CREATED enforcement violations before the state guard runs. In
      addition, the violation row promises producer suspension and admit DENY
      until re-registration, but no suspension field or transition is defined.
      The authoritative Admit rule depends only on state, rfail and mech_state;
      a still-PROTECTED class with rfail zero and mech_state OK can therefore
      derive ALLOW again on the next tick. Registration also unconditionally
      assigns store(c), conflicting with the separate custody-transfer sequence
      when the second KEYS producer registers. These are operational holes in the
      revised correction, not resolved by declaring the table authoritative.
    required_correction: >-
      Define a unique event identity and idempotency scope for every event kind,
      with copy correlation separate from event identity; distinguish a retry from
      a new fixture run or dataset creation. Add an explicit producer lifecycle
      and suspension latch, make active ownership a condition of admission and
      evidence acceptance, and define recovery from suspension. Separate producer
      registration from active-store ownership so registering a takeover producer
      cannot transfer custody prematurely; specify the transfer target and atomic
      ownership change. Extend AC-07f and AC-07d with repeated fixture runs, distinct
      dataset creations with absent copy_id, retries, suspension followed by ticks
      and heartbeats, and second-producer registration before custody transfer.
