summary: >-
  The authoritative-source and current-compatibility gates remain unsatisfied.
  Explicitly declaring those gates blocked does not satisfy them or make them
  inapplicable. The revised lease still lacks a bounded elapsed-time enforcement
  mechanism under clock failure, and the revised evidence transition engine has
  incomplete idempotency and producer-suspension semantics. This version is not
  an implementation baseline.
