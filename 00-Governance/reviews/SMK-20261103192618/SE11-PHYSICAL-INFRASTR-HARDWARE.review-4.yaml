findings:
  - id: REVIEWER_EN-SE11-PHYSICAL-02
    severity: major
    type: downstream_unusable
    outline_id: OUT-SE11-PHYSICAL-INFRASTRUCTURE-HARDWARE-AR-07
    source_or_requirement_id: SE11-REQ-16
    description: >-
      Section 7.5 does not define a safe STALE-to-ON-BATTERY recovery transition.
      Its t_obs <= D bound holds only while communication is intact, but the
      derivation applies it to every ON-BATTERY path. With the worked values,
      let the last ONLINE update and utility loss occur at t=0, lose the switch,
      and restore communication with the first ON-BATTERY update at t=149 s.
      Rule 4 no longer requires shutdown at 150 s because a valid update arrived;
      rule 2 instead arms A=179 s. Host completion may be 299 s, while the NAS
      initiates at 200-210 s. The restored data path can therefore be used for a
      flush while the NAS shuts down; the blind-path exception's premise that
      no data path exists is no longer true. The runtime proof also fails for
      configurations allowed by I1-I3: changing only T_stale_max to 180 s and
      restoring the signal at 179 s permits A=209 s and host completion at 329 s,
      exceeding R_measured/2=300 s although all three admission inequalities pass.
      Drills (a)-(f) do not test recovery before initiation from a blind outage.
    required_correction: >-
      Specify recovery transitions before initiation for STALE entered from both
      ONLINE and ON-BATTERY. Preserve a latched blind-path safety deadline across
      a recovered ON-BATTERY update instead of replacing it through t_L or a fresh
      ride-through interval; define explicitly when a valid ONLINE observation
      may clear it. Restrict D=2P to intact communication and derive bounds for
      delayed first observations. Ensure NAS ordering covers recovered paths that
      can flush, either by deriving its deadline from the actual worst-case host
      completion bound or by explicitly preventing NAS-dependent flushes in those
      paths and recording that degraded recovery behaviour. Recompute runtime
      inequalities and the worked timeline accordingly. Extend GATE-06 and AC-05
      with recovery just before the blind deadline, subsequent signal loss, and
      assertions for host completion and NAS/data-path ordering. Align the ADR,
      risk and inventory references with the corrected policy.
