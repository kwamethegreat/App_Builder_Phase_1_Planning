findings:
  - id: REVIEWER_EN-SE11-PHYSICAL-02
    severity: major
    type: downstream_unusable
    outline_id: OUT-SE11-PHYSICAL-INFRASTRUCTURE-HARDWARE-AR-07
    source_or_requirement_id: SE11-REQ-16
    description: >-
      Section 7.5 does not implement its shutdown ordering assertions. It
      defines the acknowledgement as a message sent before host power-off,
      but starts NAS shutdown immediately on receipt and asserts that this
      is necessarily at or after host power-off. A pre-power-off message
      cannot establish that ordering; SE11-AC-05(a) can fail with an intact
      signal path. The revised during-loss example also contradicts the
      ON-BATTERY timer: observation at 20 s and T_ob of 30 s require shutdown
      initiation by 50 s, whereas the example and drill (e) require initiation
      at t_L + T_stale = 100 s. No precedence or irreversible shutdown latch
      resolves these competing instructions.
    required_correction: >-
      Separate acknowledgement transmission from actual host power-off.
      Preserve host-before-NAS ordering using an explicit bounded delay or
      the already bounded host-completion deadline before NAS initiation;
      account for the chosen mechanism in the runtime inequalities and
      no-acknowledgement fallback. Specify that shutdown initiation is
      irreversible and occurs at the earliest applicable deadline, with a
      previously armed ON-BATTERY deadline never postponed by signal loss.
      Correct the worked timeline and drills to exercise signal loss both
      before and after shutdown initiation, and align SE11-GATE-06 and
      SE11-AC-05 with those observable events.
  - id: REVIEWER_EN-SE11-PHYSICAL-03
    severity: major
    type: downstream_unusable
    outline_id: OUT-SE11-PHYSICAL-INFRASTRUCTURE-HARDWARE-AR-07
    source_or_requirement_id: SE11-GATE-04
    description: >-
      The revised loading-failure response in section 7.3(c) substitutes a
      larger UPS and repeats the gate, but the gate still requires projected
      load to be at most 80 percent of 1000 W and 1500 VA. Those fixed original
      ratings also remain in section 10.3. Unlike L_PSU, no installed-UPS
      rating replaces them after substitution. For example, an 850 W load
      fails the original 800 W limit and still fails it after installing the
      stated 1300 W-class alternative, despite being below 80 percent of
      that alternative's rating. The documented remedy cannot close its gate.
    required_correction: >-
      Define inventory-backed installed UPS output ratings in W and VA and
      express loading admission against 80 percent of those installed
      ratings. Keep 1000 W and 1500 VA as baseline values only. On UPS
      substitution, update both ratings and remeasure the runtime-versus-load
      curve, shutdown durations and relevant drills before repeating admission.
      Align sections 7.1, 7.3, 9.1, 10.3 and SE11-AC-05, and include a worked
      loading-failure substitution that can actually pass the revised gate.
