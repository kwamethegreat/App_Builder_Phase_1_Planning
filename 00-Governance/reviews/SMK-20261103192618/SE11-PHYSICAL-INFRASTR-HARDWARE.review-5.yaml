findings:
  - id: REVIEWER_EN-SE11-PHYSICAL-02
    severity: major
    type: downstream_unusable
    outline_id: OUT-SE11-PHYSICAL-INFRASTRUCTURE-HARDWARE-AR-07
    source_or_requirement_id: SE11-REQ-16
    description: >-
      Section 7.5 equates absence of a STALE interval with intact communication and
      therefore asserts first ON-BATTERY receipt within D = 2P. But STALE is entered
      only after T_stale without an update, which is 60 seconds in the worked
      configuration versus D = 20 seconds. Lost polls followed by a fresh ON-BATTERY
      response before that timeout satisfy neither the intact bound nor rule 9,
      which requires an already-latched B. For example, with the worked parameters,
      last ONLINE at utility loss and first fresh ON-BATTERY receipt at 50 seconds
      never enters STALE. Applying rule 2 gives A = 80 and host completion up to
      200, while NAS initiation remains 200–210; the required 30-second ordering
      margin fails despite I1–I3 passing. Under the document's allowed last ONLINE
      receipt at D = 20, a fresh ON-BATTERY receipt at 70 is likewise before STALE
      at 80 and permits host completion at 220, after NAS initiation. The worked
      early-recovery row at 25 seconds already exhibits this missing transition:
      it uses B_ON even though rule 4 cannot have latched B before 60 seconds.
      An implementer cannot determine flush eligibility and the safe deadline for
      this reachable path from the stated rules.
    required_correction: >-
      Define an observable transition for missed or delayed polls before the STALE
      timeout. Either classify those gaps as blind with explicitly armed deadlines
      and local-only recovery, or derive conservative flush-eligible timing bounds
      that include the entire permitted observation gap and adjust the NAS deadline
      and admission inequalities accordingly. Do not infer the 2P bound solely from
      absence of STALE. Make the early-recovery example follow the actual arming
      rules, and extend SE11-GATE-06 and SE11-AC-05 with recovery before T_stale,
      including first ON-BATTERY receipt later than D and boundary cases just before
      STALE. Each test must establish its initiating deadline, flush eligibility,
      host completion, NAS initiation and the required ordering margin or explicit
      local-only behavior. Reconcile the resulting proof and dependent summaries.
