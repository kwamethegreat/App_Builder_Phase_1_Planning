    description: >-
      Section 14.1 has two inaccurate drill expectations despite the corrected
      normative rules in section 7.5. Drill (j) calls t_obs = t_ON + T_ob - P
      later than D, but the planning values with t_ON = 0 yield t_obs = 20 = D;
