      occurs on A, before B_OB can be latched. These descriptions can mislabel
      evidence from a conforming client; they do not invalidate the normative
      completion bounds.
    required_correction: >-
      Give drill (j) an explicit admissible t_ON and t_obs satisfying
      D < t_obs <= t_ON + T_ob, or use the worked 25-second observation with
      t_ON = 0 and explicitly control receipt timing. In drill (e), expect A
      when initiation precedes STALE; expect B_OB only if it was actually
      latched before initiation. Preserve the existing completion and ordering
      assertions and record the deadline that actually fired.
