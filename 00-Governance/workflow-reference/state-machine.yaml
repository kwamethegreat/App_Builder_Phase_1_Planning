# ENV-01 normative run specification (plan v10 §1, frozen in Phase 1)
# This file is the single source of truth for run/task states and limits.
# test/spec.test.ts asserts that src/run.ts conforms to it.
spec_version: "10.0"
frozen: true

run_states:
  - CREATED
  - VALIDATING_CONFIG
  - APPLICABILITY
  - RUNNING
  - COMPILING
  - FINAL_REVIEW
  - COMPLETE
  - FAILED_CONFIGURATION
  - FAILED_PROVIDER
  - FAILED_DOCUMENT
  - FAILED_NONCONVERGENCE

# The chain is fully autonomous. This list MUST stay empty.
wait_for_human_states: []

terminal_run_states:
  - COMPLETE
  - FAILED_CONFIGURATION
  - FAILED_PROVIDER
  - FAILED_DOCUMENT
  - FAILED_NONCONVERGENCE

task_states:
  - PENDING
  - READY
  - AUTHORING
  - REVIEWING
  - REVISING
  - COMPLETE
  - SKIPPED
  - BLOCKED_BY_FAILURE
  - FAILED_NONCONVERGENCE
  - FAILED_DOCUMENT
  - FAILED_PROVIDER

terminal_task_states:
  - COMPLETE
  - SKIPPED
  - BLOCKED_BY_FAILURE
  - FAILED_NONCONVERGENCE
  - FAILED_DOCUMENT
  - FAILED_PROVIDER

limits:
  max_review_cycles: 6          # operator decision: reviewed up to 6 times, then branch-scoped failure
  max_invocation_retries: 2     # transient/validator retries per invocation before FAILED_DOCUMENT/FAILED_PROVIDER

# Task transitions (event -> from -> to). Anything not listed is rejected.
task_transitions:
  - { event: start,              from: [PENDING, READY],               to: AUTHORING }
  - { event: author_ok,          from: [AUTHORING, REVISING],          to: REVIEWING }
  - { event: author_invalid,     from: [AUTHORING, REVISING],          to: same, until: max_invocation_retries, then: FAILED_DOCUMENT, failure_log: true, block_downstream: true }
  - { event: review(pass),       from: [REVIEWING],                    to: COMPLETE }
  - { event: review(revise),     from: [REVIEWING],                    to: REVISING, until: max_review_cycles, then: FAILED_NONCONVERGENCE, failure_log: true, block_downstream: true }
  - { event: transient_error,    from: [AUTHORING, REVISING, REVIEWING], to: same, until: max_invocation_retries, then: FAILED_PROVIDER, failure_log: true, block_downstream: true }
  - { event: provider_exhausted, from: [any],                          to: FAILED_PROVIDER, failure_log: true, block_downstream: true }
  - { event: upstream_failed,    from: [PENDING],                      to: BLOCKED_BY_FAILURE }
  - { event: not_applicable,     from: [PENDING],                      to: SKIPPED }

# Run outcome, evaluated when no task is runnable (precedence order)
run_outcome:
  - { if: any_task FAILED_NONCONVERGENCE, then: FAILED_NONCONVERGENCE }
  - { if: any_task FAILED_DOCUMENT,       then: FAILED_DOCUMENT }
  - { if: any_task FAILED_PROVIDER,       then: FAILED_PROVIDER }
  - { if: any_task PENDING,               then: FAILED_CONFIGURATION }
  - { else: COMPLETE }

artifacts:
  failure_log: "00-Governance/run/{run_id}/failures/{task_id}.failure.md"
  run_record:  "00-Governance/run/{run_id}/run.md"
  compiled_plan: "40-Engineering-Lead/EL/EL-COMPILED-IMPL-PLAN.md"

seeds:
  path: "00-Governance/workflow-reference/seeds/"
  filename: "SEED-nn-<slug>.md"
  header: { id: "SEED-nn", version: "1.0", status: approved, owner: OP }
  # Machine metadata only. The body is free-form prose (headings, tables, lists, decisions, requirements …)
  # describing the platform itself; nothing in the body is validated by software — the agents interpret it.
  machine_checks: [file_readable, unified_header_present, id_matches_SEED-nn, id_unique, status_approved, owner_OP, version_present, body_non_empty]
  body_min_chars: 200
  semantic_checks: none
  rule: "At least one seed file; every seed passes the machine checks; otherwise the run stops in VALIDATING_CONFIG as FAILED_CONFIGURATION. Every seed is supplied in full to the Stage-0 package and to every authoring/review invocation (subject to the context cap)."

applicability:
  decided_by: "the applicability task (kind: applicability, owner SP13, stage 0) reading the complete seed corpus + the Stage-0 PL package"
  conditional_domains: "derived from the registry: every role gated by a domain:/pairing: applicability rule (SP01–SP17, SE23, SE24)"
  output: "one Markdown table in the decision document: | domain | determination | evidence |"
  determinations: [applies, does_not_apply, unknown]
  evidence: "required for applies/does_not_apply — cites SEED-nn or a source document id; unknown must state what evidence was missing"
  machine_checks: [row_per_conditional_domain, determination_in_vocabulary, evidence_present, no_duplicate_rows]   # failure ⇒ author_invalid
  review: "independent peer review through the ordinary review cycle (≤ 6) before the decision is authoritative"
  freeze: "on review pass: unknown ⇒ applies; mask written to 00-Governance/run/{run_id}/applicability.json and to the run record; non-applicable tasks → SKIPPED; the mask never changes for the rest of the run"

standards:
  path: "00-Governance/workflow-reference/standards/"
  rule: "Operator-supplied engineering and non-engineering content standards, supplied in full as context. Phase 4 additionally normalises them into criterion IDs for the coverage validator; every document class must map to at least one criterion."
